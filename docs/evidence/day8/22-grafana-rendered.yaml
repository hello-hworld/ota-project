---
# Source: grafana/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: false
metadata:
  labels:
    helm.sh/chart: grafana-13.6.0
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/version: "13.2.4"
  name: grafana
  namespace: monitoring
---
# Source: grafana/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana
  namespace: monitoring
  labels:
    helm.sh/chart: grafana-13.6.0
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/version: "13.2.4"
data:
  
  grafana.ini: |
    [analytics]
    check_for_plugin_updates = false
    check_for_updates = false
    reporting_enabled = false
    [log]
    mode = console
    [paths]
    data = /var/lib/grafana/
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    [plugins]
    preinstall_auto_update = false
    [server]
    domain = ''
    [unified_storage]
    index_path = /var/lib/grafana-search/bleve
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - access: proxy
      editable: false
      isDefault: true
      jsonData:
        httpMethod: POST
        timeInterval: 30s
      name: prometheus-a
      type: prometheus
      uid: prometheus-a
      url: http://prometheus-server.monitoring.svc.cluster.local
    - access: proxy
      editable: false
      jsonData:
        httpMethod: POST
        timeInterval: 30s
      name: prometheus-b
      type: prometheus
      uid: prometheus-b
      url: http://192.168.56.32:30909
  dashboardproviders.yaml: |
    apiVersion: 1
    providers:
    - allowUiUpdates: false
      disableDeletion: true
      folder: OTA
      name: ota
      options:
        path: /var/lib/grafana/dashboards/ota
      orgId: 1
      type: file
      updateIntervalSeconds: 30
---
