    enabled: true
    job_name: ''
    honor_labels: true
    kubernetes_sd_configs:
    - role: service
    relabel_configs:
    - source_labels:
      - __meta_kubernetes_service_annotation_prometheus_io_probe
      action: keep
      regex: pushgateway
    pre_relabel_configs: ''
    post_relabel_configs: ''
  kubernetes-services:
    enabled: true
    job_name: ''
    honor_labels: true
    metrics_path: /probe
    params:
      module:
      - http_2xx
    kubernetes_sd_configs:
    - role: service
    relabel_configs:
    - source_labels:
      - __meta_kubernetes_service_annotation_prometheus_io_probe
      action: keep
      regex: true
    - source_labels:
      - __address__
      target_label: __param_target
    - target_label: __address__
      replacement: blackbox
    - source_labels:
      - __param_target
      target_label: instance
    - action: labelmap
      regex: __meta_kubernetes_service_label_(.+)
    - source_labels:
      - __meta_kubernetes_namespace
      target_label: namespace
    - source_labels:
      - __meta_kubernetes_service_name
      target_label: service
    pre_relabel_configs: ''
    post_relabel_configs: ''
  kubernetes-pods:
    enabled: true
    job_name: ''
    honor_labels: true
    kubernetes_sd_configs:
    - role: pod
    relabel_configs:
    - source_labels:
      - __meta_kubernetes_pod_annotation_prometheus_io_scrape
      action: keep
      regex: true
    - source_labels:
      - __meta_kubernetes_pod_annotation_prometheus_io_scrape_slow
      action: drop
      regex: true
    - source_labels:
      - __meta_kubernetes_pod_annotation_prometheus_io_scheme
      action: replace
      regex: (https?)
      target_label: __scheme__
    - source_labels:
      - __meta_kubernetes_pod_annotation_prometheus_io_path
      action: replace
      target_label: __metrics_path__
      regex: (.+)
    - source_labels:
      - __meta_kubernetes_pod_annotation_prometheus_io_port
      - __meta_kubernetes_pod_ip
      action: replace
      regex: (\d+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})
      replacement: '[$2]:$1'
      target_label: __address__
    - source_labels:
      - __meta_kubernetes_pod_annotation_prometheus_io_port
      - __meta_kubernetes_pod_ip
      action: replace
      regex: (\d+);((([0-9]+?)(\.|$)){4})
      replacement: $2:$1
      target_label: __address__
    - action: labelmap
      regex: __meta_kubernetes_pod_annotation_prometheus_io_param_(.+)
      replacement: __param_$1
    - action: labelmap
      regex: __meta_kubernetes_pod_label_(.+)
    - source_labels:
      - __meta_kubernetes_namespace
      action: replace
      target_label: namespace
    - source_labels:
      - __meta_kubernetes_pod_name
      action: replace
      target_label: pod
    - source_labels:
      - __meta_kubernetes_pod_phase
      regex: Pending|Succeeded|Failed|Completed
      action: drop
    - source_labels:
      - __meta_kubernetes_pod_node_name
      action: replace
      target_label: node
    pre_relabel_configs: ''
    post_relabel_configs: ''
  kubernetes-pods-slow:
    enabled: true
    job_name: ''
    honor_labels: true
    scrape_interval: 5m
    scrape_timeout: 30s
    kubernetes_sd_configs:
    - role: pod
    relabel_configs:
    - source_labels:
      - __meta_kubernetes_pod_annotation_prometheus_io_scrape_slow
      action: keep
      regex: true
    - source_labels:
      - __meta_kubernetes_pod_annotation_prometheus_io_scheme
      action: replace
      regex: (https?)
      target_label: __scheme__
    - source_labels:
      - __meta_kubernetes_pod_annotation_prometheus_io_path
      action: replace
      target_label: __metrics_path__
      regex: (.+)
    - source_labels:
      - __meta_kubernetes_pod_annotation_prometheus_io_port
      - __meta_kubernetes_pod_ip
      action: replace
      regex: (\d+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})
      replacement: '[$2]:$1'
      target_label: __address__
    - source_labels:
      - __meta_kubernetes_pod_annotation_prometheus_io_port
      - __meta_kubernetes_pod_ip
      action: replace
      regex: (\d+);((([0-9]+?)(\.|$)){4})
      replacement: $2:$1
      target_label: __address__
    - action: labelmap
      regex: __meta_kubernetes_pod_annotation_prometheus_io_param_(.+)
      replacement: __param_$1
    - action: labelmap
      regex: __meta_kubernetes_pod_label_(.+)
    - source_labels:
      - __meta_kubernetes_namespace
      action: replace
      target_label: namespace
    - source_labels:
      - __meta_kubernetes_pod_name
      action: replace
      target_label: pod
    - source_labels:
      - __meta_kubernetes_pod_phase
      regex: Pending|Succeeded|Failed|Completed
      action: drop
    - source_labels:
      - __meta_kubernetes_pod_node_name
      action: replace
      target_label: node
    pre_relabel_configs: ''
    post_relabel_configs: ''
