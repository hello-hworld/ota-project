scrapeConfigs:
  prometheus:
    enabled: true
    job_name: ''
    static_configs:
    - targets:
      - localhost:9090
  kubernetes-api-servers:
    enabled: true
    job_name: ''
    kubernetes_sd_configs:
    - role: endpointslice
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
    - source_labels:
      - __meta_kubernetes_namespace
      - __meta_kubernetes_service_name
      - __meta_kubernetes_endpointslice_port_name
      action: keep
      regex: default;kubernetes;https
    pre_relabel_configs: ''
    post_relabel_configs: ''
  kubernetes-nodes:
    enabled: true
    job_name: ''
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
    - role: node
    relabel_configs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
    pre_relabel_configs: ''
    post_relabel_configs: ''
  kubernetes-nodes-cadvisor:
    enabled: true
    job_name: ''
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    metrics_path: /metrics/cadvisor
    kubernetes_sd_configs:
    - role: node
    relabel_configs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
    - source_labels:
      - __metrics_path__
      target_label: metrics_path
    pre_relabel_configs: ''
    post_relabel_configs: ''
  kubernetes-service-endpoints:
    enabled: true
    job_name: ''
    honor_labels: true
    kubernetes_sd_configs:
    - role: endpointslice
    relabel_configs:
    - source_labels:
      - __meta_kubernetes_service_annotation_prometheus_io_scrape
      action: keep
      regex: true
    - source_labels:
      - __meta_kubernetes_service_annotation_prometheus_io_scrape_slow
      action: drop
      regex: true
    - source_labels:
      - __meta_kubernetes_service_annotation_prometheus_io_scheme
      action: replace
      target_label: __scheme__
      regex: (https?)
    - source_labels:
      - __meta_kubernetes_service_annotation_prometheus_io_path
      action: replace
      target_label: __metrics_path__
      regex: (.+)
    - source_labels:
      - __address__
      - __meta_kubernetes_service_annotation_prometheus_io_port
      action: replace
      target_label: __address__
      regex: (.+?)(?::\d+)?;(\d+)
      replacement: $1:$2
    - action: labelmap
      regex: __meta_kubernetes_service_annotation_prometheus_io_param_(.+)
      replacement: __param_$1
    - action: labelmap
      regex: __meta_kubernetes_service_label_(.+)
    - source_labels:
      - __meta_kubernetes_namespace
      action: replace
      target_label: namespace
    - source_labels:
      - __meta_kubernetes_service_name
      action: replace
      target_label: service
    - source_labels:
      - __meta_kubernetes_pod_node_name
      action: replace
      target_label: node
    pre_relabel_configs: ''
    post_relabel_configs: ''
  kubernetes-service-endpoints-slow:
    enabled: true
    job_name: ''
    honor_labels: true
    scrape_interval: 5m
    scrape_timeout: 30s
    kubernetes_sd_configs:
    - role: endpointslice
    relabel_configs:
    - source_labels:
      - __meta_kubernetes_service_annotation_prometheus_io_scrape_slow
      action: keep
      regex: true
    - source_labels:
      - __meta_kubernetes_service_annotation_prometheus_io_scheme
      action: replace
      target_label: __scheme__
      regex: (https?)
    - source_labels:
      - __meta_kubernetes_service_annotation_prometheus_io_path
      action: replace
      target_label: __metrics_path__
      regex: (.+)
    - source_labels:
      - __address__
      - __meta_kubernetes_service_annotation_prometheus_io_port
      action: replace
      target_label: __address__
      regex: (.+?)(?::\d+)?;(\d+)
      replacement: $1:$2
    - action: labelmap
      regex: __meta_kubernetes_service_annotation_prometheus_io_param_(.+)
      replacement: __param_$1
    - action: labelmap
      regex: __meta_kubernetes_service_label_(.+)
