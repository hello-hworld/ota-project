# ci/agent-pod.yaml — CI 빌드용 Agent Pod
# 기본 Template 'default'(Helm values)를 상속한다(yamlMergeStrategy merge).
# jnlp 컨테이너·namespace(ci)·nodeSelector(workload=platform)·serviceAccount(jenkins-agent)는 상속분이다.
# <...> 자리는 STEP 12-3에서 확인한 태그와 digest로 바꾼다.
apiVersion: v1
kind: Pod
metadata:
  labels:
    ota-ci-build: "true"
spec:
  containers:
    - name: python
      image: docker.io/library/python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
      command: ["cat"]
      tty: true
      resources:
        requests: {cpu: "100m", memory: "64Mi"}
        limits: {cpu: "500m", memory: "256Mi"}
    # 전환안 A·B는 STEP 13-3 참고. 기본은 rootless.
    - name: buildkit
      image: docker.io/moby/buildkit:v0.34.0-rootless@sha256:65eca3c01cd1180c8f64565c4e3c5983af5145818b0e6fa863385d099eb73855
      args: ["--oci-worker-no-process-sandbox"]
      env:
        - name: BUILDKIT_HOST
          value: unix:///run/user/1000/buildkit/buildkitd.sock
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: Unconfined}
        appArmorProfile: {type: Unconfined}
      volumeMounts:
        - name: buildkitd-state
          mountPath: /home/user/.local/share/buildkit
      resources:
        requests: {cpu: "500m", memory: "256Mi"}
        limits: {cpu: "2", memory: "1536Mi"}
    - name: trivy
      image: docker.io/aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
      command: ["cat"]
      tty: true
      volumeMounts:
        - name: trivy-cache
          mountPath: /trivy-cache
      resources:
        requests: {cpu: "200m", memory: "256Mi"}
        limits: {cpu: "1", memory: "1Gi"}
    - name: skopeo
      image: quay.io/skopeo/stable:v1.22.3@sha256:22ea3c3baf639147b07fb9f2ea28a6308edf7909e919d91a5d296af0121d7ed9
      command: ["cat"]
      tty: true
      resources:
        requests: {cpu: "100m", memory: "64Mi"}
        limits: {cpu: "500m", memory: "256Mi"}
  volumes:
    - name: buildkitd-state
      emptyDir: {}
    - name: trivy-cache
      persistentVolumeClaim:
        claimName: trivy-cache
