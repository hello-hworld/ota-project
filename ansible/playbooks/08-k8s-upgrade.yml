---
# =====================================================================
# 08-k8s-upgrade.yml — kubeadm 클러스터 하나를 Kubernetes minor 하나만 올린다 (Control Plane 1대 → Worker 1대씩)
# 실행 위치 : [ota-host] ~/ota-project. 보통 scripts/k8s-hop.sh가 사전·사후 관문과 함께 호출한다
# 사용법    : ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/08-k8s-upgrade.yml \
#               -e cluster=a -e k8s_version=1.31.14
# 순서      : 공식 'Upgrading kubeadm clusters'와 같다
#             Control Plane: 저장소 → kubeadm → upgrade plan → 이미지 미리 받기 → upgrade apply → drain → kubelet·kubectl → uncordon
#             Worker(한 대씩): 저장소 → kubeadm → upgrade node → drain → kubelet·kubectl → uncordon
# 규칙      : minor를 건너뛰지 않는다. API 서버는 목표의 바로 전 minor이거나 목표와 같아야 한다(재실행)
#             이미 목표 버전인 Node는 건너뛴다. 하나라도 실패하면 전체를 멈춘다(any_errors_fatal)
#             drain은 --ignore-daemonsets --delete-emptydir-data (Jenkins·Argo CD가 emptyDir을 쓴다). --force는 쓰지 않는다
# 1.35 이상 : kubelet 1.35는 --pod-infra-container-image 플래그가 있으면 시작하지 않는다. kubeadm 1.35가 upgrade 중에
#             /var/lib/kubelet/kubeadm-flags.env에서 지우므로, kubelet을 재시작하기 전에 지워졌는지 확인한다
#             kubelet 1.35는 기본으로 cgroup v1에서 시작을 거부한다 → cgroup v2인지 먼저 확인한다
# =====================================================================
- name: Check input
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Validate cluster and version
      ansible.builtin.assert:
        that:
          - cluster | default('') in ['a', 'b']
          - k8s_version | default('') is match('^1\.[0-9]+\.[0-9]+$')
        fail_msg: "사용법: -e cluster=<a|b> -e k8s_version=<예: 1.31.14>"

- name: Upgrade control plane
  hosts: "cluster_{{ cluster }}_control"
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    k8s_minor: "{{ k8s_version.split('.')[0:2] | join('.') }}"
    target_minor: "{{ k8s_version.split('.')[1] | int }}"
    kc: kubectl --kubeconfig /etc/kubernetes/admin.conf
  tasks:
    - name: Read API server version
      ansible.builtin.command: "{{ kc }} version -o json"
      register: cp_ver
      changed_when: false

    - name: Decide what to do
      ansible.builtin.set_fact:
        server_version: "{{ (cp_ver.stdout | from_json).serverVersion.gitVersion }}"
        server_minor: "{{ (cp_ver.stdout | from_json).serverVersion.gitVersion.split('.')[1] | int }}"

    - name: No minor skipping
      ansible.builtin.assert:
        that: server_version == 'v' ~ k8s_version or (server_minor | int) == (target_minor | int) - 1
        fail_msg: "API 서버 {{ server_version }} → v{{ k8s_version }} 는 minor 하나 차이가 아니다"

    - name: Read this node's kubelet version
      ansible.builtin.command: >-
        {{ kc }} get node {{ inventory_hostname }} -o jsonpath={.status.nodeInfo.kubeletVersion}
      register: cp_kubelet
      changed_when: false

    - name: Check cgroup v2 (kubelet 1.35+)
      ansible.builtin.command: stat -fc %T /sys/fs/cgroup
      register: cp_cgroup
      changed_when: false
      failed_when: cp_cgroup.stdout != 'cgroup2fs'
      when: target_minor | int >= 35

    - name: Upgrade this control plane node
      when: server_version != 'v' ~ k8s_version or cp_kubelet.stdout != 'v' ~ k8s_version
      block:
        - name: Timestamp
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }} control plane start {{ lookup('ansible.builtin.pipe', 'date -u +%FT%TZ') }}"

        - name: Install kubeadm {{ k8s_version }}
          ansible.builtin.include_tasks: tasks/k8s-packages.yml
          vars:
            k8s_pkgs: [kubeadm]

        - name: Check kubeadm version
          ansible.builtin.command: kubeadm version -o short
          register: cp_kubeadm
          changed_when: false
          failed_when: cp_kubeadm.stdout != 'v' ~ k8s_version

        - name: kubeadm-flags.env before
          ansible.builtin.command: cat /var/lib/kubelet/kubeadm-flags.env
          register: cp_flags_before
          changed_when: false

        - name: Show kubeadm-flags.env before
          ansible.builtin.debug:
            var: cp_flags_before.stdout_lines

        - name: kubeadm upgrade plan
          ansible.builtin.command: kubeadm upgrade plan v{{ k8s_version }}
          register: cp_plan
          changed_when: false
          when: server_version != 'v' ~ k8s_version

        - name: Show plan
          ansible.builtin.debug:
            var: cp_plan.stdout_lines
          when: server_version != 'v' ~ k8s_version

        - name: Pull control plane images
          ansible.builtin.command: kubeadm config images pull --kubernetes-version v{{ k8s_version }}
          register: cp_pull
          changed_when: true

        - name: Show pulled images
          ansible.builtin.debug:
            var: cp_pull.stdout_lines

        - name: Timestamp before apply
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }} upgrade apply start {{ lookup('ansible.builtin.pipe', 'date -u +%FT%TZ') }}"
          when: server_version != 'v' ~ k8s_version

        - name: kubeadm upgrade apply
          ansible.builtin.command: kubeadm upgrade apply v{{ k8s_version }} --yes
          register: cp_apply
          changed_when: true
          when: server_version != 'v' ~ k8s_version

        - name: Show apply (last 30 lines)
          ansible.builtin.debug:
            var: cp_apply.stdout_lines[-30:]
          when: server_version != 'v' ~ k8s_version

        - name: kubeadm-flags.env after
          ansible.builtin.command: cat /var/lib/kubelet/kubeadm-flags.env
          register: cp_flags_after
          changed_when: false

        - name: Show kubeadm-flags.env after
          ansible.builtin.debug:
            var: cp_flags_after.stdout_lines

        - name: Flag removed in kubelet 1.35 must be gone
          ansible.builtin.assert:
            that: "'--pod-infra-container-image' not in cp_flags_after.stdout"
            fail_msg: "kubeadm-flags.env에 --pod-infra-container-image가 남아 있다. kubelet 1.35+는 시작하지 않는다 → 멈추고 확인"
          when: target_minor | int >= 35

        - name: Drain {{ inventory_hostname }}
          ansible.builtin.command: >-
            {{ kc }} drain {{ inventory_hostname }} --ignore-daemonsets --delete-emptydir-data --timeout=600s
          register: cp_drain
          changed_when: true

        - name: Show drain
          ansible.builtin.debug:
            var: cp_drain.stdout_lines

        - name: Install kubelet, kubectl {{ k8s_version }}
          ansible.builtin.include_tasks: tasks/k8s-packages.yml
          vars:
            k8s_pkgs: [kubelet, kubectl]

        - name: Restart kubelet
          ansible.builtin.systemd:
            name: kubelet
            state: restarted
            daemon_reload: true

        - name: Wait for {{ inventory_hostname }} Ready on v{{ k8s_version }}
          ansible.builtin.command: >-
            {{ kc }} get node {{ inventory_hostname }}
            -o jsonpath='{.status.nodeInfo.kubeletVersion} {.status.conditions[?(@.type=="Ready")].status}'
          register: cp_node
          until: cp_node.stdout == 'v' ~ k8s_version ~ ' True'
          retries: 30
          delay: 10
          changed_when: false

        - name: Uncordon {{ inventory_hostname }}
          ansible.builtin.command: "{{ kc }} uncordon {{ inventory_hostname }}"
          changed_when: true

        - name: Timestamp
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }} control plane end {{ lookup('ansible.builtin.pipe', 'date -u +%FT%TZ') }}"

- name: Upgrade workers one by one
  hosts: "cluster_{{ cluster }}_workers"
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    k8s_minor: "{{ k8s_version.split('.')[0:2] | join('.') }}"
    target_minor: "{{ k8s_version.split('.')[1] | int }}"
    kc: kubectl --kubeconfig /etc/kubernetes/admin.conf
    cp_host: "{{ groups['cluster_' ~ cluster ~ '_control'][0] }}"
  tasks:
    - name: API server must already be on v{{ k8s_version }}
      ansible.builtin.command: "{{ kc }} version -o json"
      register: w_ver
      changed_when: false
      failed_when: (w_ver.stdout | from_json).serverVersion.gitVersion != 'v' ~ k8s_version
      delegate_to: "{{ cp_host }}"

    - name: Read this node's kubelet version
      ansible.builtin.command: >-
        {{ kc }} get node {{ inventory_hostname }} -o jsonpath={.status.nodeInfo.kubeletVersion}
      register: w_kubelet
      changed_when: false
      delegate_to: "{{ cp_host }}"

    - name: Check cgroup v2 (kubelet 1.35+)
      ansible.builtin.command: stat -fc %T /sys/fs/cgroup
      register: w_cgroup
      changed_when: false
      failed_when: w_cgroup.stdout != 'cgroup2fs'
      when: target_minor | int >= 35

    - name: Upgrade this worker
      when: w_kubelet.stdout != 'v' ~ k8s_version
      block:
        - name: Timestamp
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }} worker start {{ lookup('ansible.builtin.pipe', 'date -u +%FT%TZ') }}"

        - name: Install kubeadm {{ k8s_version }}
          ansible.builtin.include_tasks: tasks/k8s-packages.yml
          vars:
            k8s_pkgs: [kubeadm]

        - name: Check kubeadm version
          ansible.builtin.command: kubeadm version -o short
          register: w_kubeadm
          changed_when: false
          failed_when: w_kubeadm.stdout != 'v' ~ k8s_version

        - name: kubeadm-flags.env before
          ansible.builtin.command: cat /var/lib/kubelet/kubeadm-flags.env
          register: w_flags_before
          changed_when: false

        - name: Show kubeadm-flags.env before
          ansible.builtin.debug:
            var: w_flags_before.stdout_lines

        - name: kubeadm upgrade node
          ansible.builtin.command: kubeadm upgrade node
          register: w_upgrade
          changed_when: true

        - name: Show upgrade node (last 15 lines)
          ansible.builtin.debug:
            var: w_upgrade.stdout_lines[-15:]

        - name: kubeadm-flags.env after
          ansible.builtin.command: cat /var/lib/kubelet/kubeadm-flags.env
          register: w_flags_after
          changed_when: false

        - name: Show kubeadm-flags.env after
          ansible.builtin.debug:
            var: w_flags_after.stdout_lines

        - name: Flag removed in kubelet 1.35 must be gone
          ansible.builtin.assert:
            that: "'--pod-infra-container-image' not in w_flags_after.stdout"
            fail_msg: "kubeadm-flags.env에 --pod-infra-container-image가 남아 있다. kubelet 1.35+는 시작하지 않는다 → 멈추고 확인"
          when: target_minor | int >= 35

        - name: Drain {{ inventory_hostname }}
          ansible.builtin.command: >-
            {{ kc }} drain {{ inventory_hostname }} --ignore-daemonsets --delete-emptydir-data --timeout=600s
          register: w_drain
          changed_when: true
          delegate_to: "{{ cp_host }}"

        - name: Show drain
          ansible.builtin.debug:
            var: w_drain.stdout_lines

        - name: Install kubelet, kubectl {{ k8s_version }}
          ansible.builtin.include_tasks: tasks/k8s-packages.yml
          vars:
            k8s_pkgs: [kubelet, kubectl]

        - name: Restart kubelet
          ansible.builtin.systemd:
            name: kubelet
            state: restarted
            daemon_reload: true

        - name: Wait for {{ inventory_hostname }} Ready on v{{ k8s_version }}
          ansible.builtin.command: >-
            {{ kc }} get node {{ inventory_hostname }}
            -o jsonpath='{.status.nodeInfo.kubeletVersion} {.status.conditions[?(@.type=="Ready")].status}'
          register: w_node
          until: w_node.stdout == 'v' ~ k8s_version ~ ' True'
          retries: 30
          delay: 10
          changed_when: false
          delegate_to: "{{ cp_host }}"

        - name: Uncordon {{ inventory_hostname }}
          ansible.builtin.command: "{{ kc }} uncordon {{ inventory_hostname }}"
          changed_when: true
          delegate_to: "{{ cp_host }}"

        - name: Timestamp
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }} worker end {{ lookup('ansible.builtin.pipe', 'date -u +%FT%TZ') }}"
