# values/production.yaml — Cluster B / production (worker-b1·worker-b2)
# image.digest는 Staging 검증을 통과한 값만 넣는다. 비어 있으면 렌더링이 실패한다(STEP 6 전 오등록 방지)
replicaCount: 2

image:
  digest: sha256:6068b90a242e7d40415786a9b7498f81a8b3f9324f4944d163a699df231e7b8e

probes:
  readiness:
    path: /healthz

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["worker-b1", "worker-b2"]

topologySpread:
  enabled: true                   # pod-template-hash 단위로 hostname 분산 → 새 ReplicaSet도 1대씩
