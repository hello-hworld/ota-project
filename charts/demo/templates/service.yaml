apiVersion: v1
kind: Service
metadata:
  name: {{ include "ota-demo.name" . }}
  labels:
    {{- include "ota-demo.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ota-demo.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
